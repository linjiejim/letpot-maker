<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tripo Candidate Review · LetPot Maker</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <aside>
        <p class="eyebrow">LOCAL REVIEW TOOL</p>
        <h1>Tripo official candidates</h1>
        <p>Generated GLBs stay in this ignored local folder. The preview uses the same standard adapter and socket logic as Maker Studio.</p>
        <nav id="candidate-list" aria-label="Choose candidate"></nav>
        <dl id="candidate-stats"></dl>
      </aside>
      <section id="stage" aria-label="3D candidate preview">
        <div id="viewport"></div>
        <div class="stage-copy"><span id="candidate-label">Loading candidate…</span><b>Drag to rotate · wheel to zoom</b></div>
      </section>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
