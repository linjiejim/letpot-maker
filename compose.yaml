name: letpot-maker

services:
  letpot-maker:
    image: ${LETPOT_IMAGE:-letpot-maker:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${LETPOT_BIND_ADDRESS:-127.0.0.1}:${LETPOT_PORT:-3000}:3000"
    environment:
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_DISABLE_THINKING: ${AI_DISABLE_THINKING:-false}
      AI_RATE_LIMIT_MAX: ${AI_RATE_LIMIT_MAX:-5}
      AI_RATE_LIMIT_WINDOW_MS: ${AI_RATE_LIMIT_WINDOW_MS:-600000}
      AI_MAX_CONCURRENCY: ${AI_MAX_CONCURRENCY:-2}
      LETPOT_SITE_URL: ${LETPOT_SITE_URL:-}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
