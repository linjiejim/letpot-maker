name: Production release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: letpot-maker-production
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
  SITE_URL: https://maker.letpot.com

jobs:
  verify:
    name: verify
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository checks
        run: npm run ci

  publish:
    name: publish image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=LetPot Maker
            org.opencontainers.image.description=Open maker tools and printable 3D accessories for LetPot gardens
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish AMD64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # shellcheck disable=SC2016
          {
            printf '### Published image\n\n'
            printf -- '- Image: `%s:sha-%s`\n' "$IMAGE_REPOSITORY" "$GITHUB_SHA"
            printf -- '- Digest: `%s`\n' "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy production
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://maker.letpot.com
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure restricted deployment SSH key
        env:
          DEPLOY_KEY: ${{ secrets.LETPOT_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.LETPOT_DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/letpot-maker-deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/letpot-maker-known-hosts"

      - name: Transfer and deploy immutable image
        env:
          LETPOT_DEPLOY_HOST: ${{ vars.LETPOT_DEPLOY_HOST }}
          LETPOT_DEPLOY_PORT: ${{ vars.LETPOT_DEPLOY_PORT }}
          LETPOT_DEPLOY_USER: ${{ vars.LETPOT_DEPLOY_USER }}
          LETPOT_IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
          LETPOT_IMAGE_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
          LETPOT_RELEASE_SHA: ${{ github.sha }}
        run: |
          export LETPOT_SSH_KEY_FILE="$HOME/.ssh/letpot-maker-deploy"
          export LETPOT_KNOWN_HOSTS_FILE="$HOME/.ssh/letpot-maker-known-hosts"
          ./scripts/deploy-release-image.sh

      - name: Verify public production endpoints
        env:
          LETPOT_SITE_URL: ${{ env.SITE_URL }}
        run: node scripts/verify-production.mjs

      - name: Summarize deployment
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          # shellcheck disable=SC2016
          {
            printf '### Production deployment\n\n'
            printf -- '- URL: %s\n' "$SITE_URL"
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Digest: `%s`\n' "$IMAGE_DIGEST"
            printf -- '- Health and SEO smoke checks: passed\n'
          } >> "$GITHUB_STEP_SUMMARY"

  summarize:
    name: publish release notes
    needs: [publish, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create generated production release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LETPOT_IMAGE: ${{ needs.publish.outputs.image }}
          LETPOT_IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
          LETPOT_RELEASE_SHA: ${{ github.sha }}
          LETPOT_SITE_URL: ${{ env.SITE_URL }}
        run: ./scripts/create-production-release.sh
